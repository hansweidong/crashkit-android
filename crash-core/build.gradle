plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
    id "maven-publish"
}

// 优先获取环境变量中的 Tag 版本，没有则从 git tag 获取
def getLibraryVersion = { ->
    def envVersion = System.getenv("NO_TAG_VERSION") ?: System.getenv("VERSION")
    if (envVersion != null && !envVersion.isEmpty()) {
        return envVersion.replaceAll("^v", "")
    }
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--always'
            standardOutput = stdout
        }
        return stdout.toString().trim().replaceAll("^v", "")
    } catch (Exception e) {
        return "1.0.0"
    }
}

allprojects {
    group = "com.yj.crashkit"
    version = getLibraryVersion() // 统一应用版本号
}

android {
    namespace "com.yj.crashkit"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 24
        targetSdk 36
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fvisibility=hidden"
                arguments "-DANDROID_STL=c++_static",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar() // 附带源码 Jar
            withJavadocJar() // 附带 Javadoc Jar
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    testImplementation "junit:junit:4.13.2"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "com.yj.crashkit"
                artifactId = "crash-core"
                version = project.version
            }
        }
    }
}
